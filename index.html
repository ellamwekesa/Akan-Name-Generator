<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Get To Know your Akan Name</h1>
        <p>
            Get your Akan name based on your <strong>birthdate</strong> and<strong> gender</strong> using this simple Akan name generator.
        </p>
    </header>

    <section>
        <form id="Akan">
            <label for="birthdate">Birthdate:</label>
            <input type="date" id="birthdate" name="birthdate">
            <br><br>

            <label>Gender:</label>
            <input type="checkbox" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="checkbox" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <input type="checkbox" id="other" name="gender" value="other">
            <label for="other">other</label>
            <br><br>

            <button type="submit">Get Akan Name</button>

        </form>
    </section>

    <section id="result">
        <h2>Akan Name</h2>
        <p id="akanName"></p>
    </section>

</body>
</html>
